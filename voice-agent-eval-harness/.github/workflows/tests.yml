name: tests
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Verify dataset is reproducible
        run: uv run voice-eval generate-dataset --verify
      - name: Validate dataset
        run: uv run voice-eval validate-dataset
      - name: Run tests (no paid API calls)
        env:
          ANTHROPIC_API_KEY: ""
        run: uv run pytest -q
