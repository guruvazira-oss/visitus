[project]
name = "voice-agent-eval-harness"
version = "0.1.0"
description = "Voice Agent Evaluation Harness — BFSI Collections Benchmark: LLM-as-judge, human annotation, calibration and threshold analysis on synthetic collections calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tabulate>=0.9",
    "streamlit>=1.38",
    "typer>=0.12",
]

[project.scripts]
voice-eval = "voice_eval.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/*.py" = ["E402", "F401"]
